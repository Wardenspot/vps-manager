<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NordDesk</title>
<link rel="stylesheet" href="/static/app.css">
<!--BOOT-->
</head>
<body>
  <!-- Экран подключения -->
  <div id="connect" class="screen">
    <div class="card">
      <h1>NordDesk</h1>
      <p class="sub">Удалённый доступ</p>
      <label>ID компьютера</label>
      <input id="id" inputmode="numeric" autocomplete="off" placeholder="123 456 789">
      <label>Код подключения</label>
      <input id="code" inputmode="numeric" autocomplete="off" placeholder="6 цифр">
      <button id="connectBtn">Подключиться</button>
      <div id="status" class="status"></div>
    </div>
  </div>

  <!-- Экран сессии -->
  <div id="session" class="hidden">
    <div id="toolbar">
      <span class="brand">NordDesk</span>
      <span id="peer" class="peer"></span>
      <span class="spacer"></span>
      <label class="q">Качество
        <input id="quality" type="range" min="20" max="95" value="70">
      </label>
      <label class="q">Кадр/с
        <input id="fps" type="range" min="1" max="30" value="12">
      </label>
      <button data-combo="ctrl-alt-del" title="Ctrl+Alt+Del (может требовать системного агента)">Ctrl+Alt+Del</button>
      <button data-combo="alt-tab">Alt+Tab</button>
      <button data-combo="win-d">Win+D</button>
      <button id="clipBtn" title="Отправить буфер обмена хосту">Буфер →</button>
      <button id="fsBtn" title="Полный экран">⛶</button>
      <button id="discBtn" class="danger">Отключить</button>
    </div>
    <div id="stage">
      <canvas id="screen" tabindex="0"></canvas>
      <div id="drop">Отпустите файлы — они появятся на рабочем столе хоста</div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
