name: Снимки экранов

on:
  push:
    branches-ignore: [main]
    paths: ["app/**", ".github/workflows/screens.yml", "build.gradle.kts"]
  workflow_dispatch:

jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Сборка (проверка, что компилируется)
        run: gradle --no-daemon :app:assembleDebug
      - name: Снимки экранов (Paparazzi)
        run: gradle --no-daemon :app:recordPaparazziDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: |
            app/src/test/snapshots/images/
            app/build/reports/tests/
