name: Сборка приложения

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NK_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Ключ подписи
        id: key
        env:
          KS_B64: ${{ secrets.NK_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/nordkey.jks"
            echo "NK_KEYSTORE_FILE=$RUNNER_TEMP/nordkey.jks" >> "$GITHUB_ENV"
            echo "signed=1" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Секрет NK_KEYSTORE_B64 не задан — собираю тестовую (debug) версию"
            echo "signed=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Сборка
        env:
          NK_KEYSTORE_PASSWORD: ${{ secrets.NK_KEYSTORE_PASSWORD }}
        run: |
          if [ "${{ steps.key.outputs.signed }}" = "1" ]; then
            gradle --no-daemon :app:assembleRelease
            cp app/build/outputs/apk/release/app-release.apk NordKey.apk
          else
            gradle --no-daemon :app:assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk NordKey.apk
          fi
          ls -la NordKey.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NordKey-${{ github.run_number }}
          path: NordKey.apk

      - name: Выпуск (ссылка для клиентов)
        if: steps.key.outputs.signed == '1' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: NordKey 1.0.${{ github.run_number }}
          make_latest: true
          files: NordKey.apk
